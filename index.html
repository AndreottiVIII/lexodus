<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lexodus</title>
<meta name="description" content="Which languages a language took words from, and which it gave words to, from the etymologies in English Wiktionary.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">lexodus</a>
  <nav aria-label="Main">
    <a href="index.html" aria-current="page">Languages</a>
    <span class="soon">Words (soon)</span>
    <span class="soon">Stories (soon)</span>
    <a href="about.html">About</a>
  </nav>
</header>

<main>
  <h1>Words on the move</h1>
  <p class="lead">For 33 languages of Europe and its neighbours: which languages each one took words from, and which languages took words from it, as written in English Wiktionary. Choose a language.</p>
  <p id="loading">Loading&hellip;</p>
  <ul id="langs" class="lang-list" hidden></ul>
</main>

<footer id="site-footer"></footer>

<script src="data/fonte.js"></script>
<script src="data/lingue.js"></script>
<script src="data/archi.js"></script>
<script src="js/common.js"></script>
<script>
Lex.load().then(function (d) {
  Lex.footer(d.source);
  var ul = document.getElementById("langs");
  ul.innerHTML = d.targets.map(function (l) {
    return '<li><a href="language.html?code=' + encodeURIComponent(l.code) + '">' + Lex.esc(l.name) + '</a> <span class="note">' + Lex.esc(Lex.coverageText(l)) + "</span></li>";
  }).join("");
  ul.hidden = false;
  document.getElementById("loading").hidden = true;
}).catch(function (e) {
  document.getElementById("loading").textContent = "The data could not be loaded (" + e.message + ").";
  console.error(e);
});
</script>
</body>
</html>
