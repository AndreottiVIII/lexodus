<main>
  <h1>Words on the move</h1>
  <p class="lead">For 33 languages of Europe and its neighbours: which languages each one took words from, and which languages took words from it, as written in English Wiktionary.</p>
  <p id="loading">Loading&hellip;</p>

  <section id="grid-block" class="grid-block" aria-labelledby="grid-title" hidden>
    <div class="head">
      <h2 id="grid-title">Who took from whom</h2>
      <fieldset class="switch" id="level-switch">
        <legend class="visually-hidden">Level</legend>
        <label><input type="radio" name="level" value="1" checked> first level</label>
        <label><input type="radio" name="level" value="2"> second level</label>
      </fieldset>
    </div>
    <p id="grid-explain" class="note"></p>
    <p id="grid-status" class="grid-status" aria-live="polite">&nbsp;</p>
    <div class="grid-scroll"><table id="grid" class="grid"></table></div>
    <p id="grid-legend" class="legend note"></p>
  </section>

  <section id="langs-block" aria-labelledby="langs-title" hidden>
    <h2 id="langs-title">The 33 languages</h2>
    <ul id="langs" class="lang-list"></ul>
  </section>
</main>
